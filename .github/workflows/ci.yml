name: CI

# Läuft unabhängig vom Deploy-Workflow (siehe deploy.yml) – gibt schnelles
# Feedback (Typfehler, kaputte Flows) als eigener Status-Check, unabhängig
# davon, ob gerade direkt auf main gepusht oder über einen PR gearbeitet
# wird. Siehe AUDIT.md H2.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  e2e:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Dieselben Secrets wie im Deploy-Workflow – ohne sie würde nur der
      # localStorage-CRM-Fallback getestet statt der echten Supabase-
      # Login-Maske. e2e/helpers.ts fängt trotzdem JEDEN Supabase-Request
      # ab, es werden also auch hier nie echte Daten geschrieben.
      - run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
