name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Holt bei JEDEM Build automatisch die zuletzt im Website-Editor
  # gespeicherten Text-/Foto-/Bereichs-Änderungen aus Supabase (siehe
  # scripts/prerender.mjs) – dieser Zeitplan sorgt dafür, dass gespeicherte
  # Änderungen auch OHNE Knopfdruck innerhalb von höchstens 15 Minuten von
  # selbst live gehen. Bewusst die einfachste Lösung ganz ohne zusätzliches
  # Secret: ein GitHub-Token, das gezielt nur dieses eine Repo ansprechen
  # dürfte, lässt sich nicht automatisiert erzeugen (nur per Web-UI) – ein
  # bereits vorhandener, aber viel zu breit berechtigter Token käme dafür
  # nicht infrage (gleiches Prinzip wie bei den Supabase-Themen C1/C2).
  schedule:
    - cron: '*/15 * * * *'
  # Vom "Veröffentlichen"-Knopf im Website-Editor ausgelöst (siehe
  # supabase/functions/trigger-rebuild/) – löst sofort denselben Build aus,
  # FALLS irgendwann ein eng auf dieses Repo begrenzter GitHub-Token als
  # Supabase-Secret GITHUB_TOKEN hinterlegt wird (siehe Kommentar dort).
  # Ohne dieses Secret bleibt es bei "spätestens alle 15 Minuten" oben.
  repository_dispatch:
    types: [publish-content]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_ID: ${{ secrets.VITE_GOOGLE_ADS_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_CONVERSION_ENDPOINT: ${{ secrets.VITE_CONVERSION_ENDPOINT }}
          VITE_LEAD_NOTIFY_ENDPOINT: ${{ secrets.VITE_LEAD_NOTIFY_ENDPOINT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
